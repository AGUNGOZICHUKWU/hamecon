<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moment d'apprentissage</title>
  <style>
    body { font-family: Georgia, serif; background:#f7f7f4; margin:0;
           color:#1a1a1a; line-height:1.6; }
    .wrap { max-width:620px; margin:50px auto; background:#fff; padding:36px;
            border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08);
            border-top:5px solid #d97706; }
    h1 { color:#0d3b4f; font-size:1.6rem; }
    .lesson { white-space:pre-wrap; font-family:Arial,sans-serif; }
    .badge { display:inline-block; background:#fef3e2; color:#b45309;
             padding:4px 12px; border-radius:20px; font-size:.8rem;
             font-family:Arial,sans-serif; font-weight:bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">EXERCICE DE FORMATION · TRAINING EXERCISE</span>
    <h1>This was a safe training test</h1>
    <p>Nothing was stolen. No password was saved. This was a simulated phishing
       message sent as part of a consented awareness exercise. Here is what to learn:</p>
    <div class="lesson">{{ lesson }}</div>
  </div>
</body>
</html>
