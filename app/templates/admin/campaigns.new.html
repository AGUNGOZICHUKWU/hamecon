{% extends "base.html" %}
{% block title %}New campaign · Hameçon{% endblock %}
{% block content %}
<div class="eyebrow">Admin · Campaigns</div>
<h1>New campaign</h1>
<p class="muted">Describe the scenario in one line. Claude will generate the phishing content for your review.</p>

<div class="card" style="max-width:680px;">
<form method="post" class="stack">
  <div class="field">
    <label for="name">Campaign name</label>
    <input id="name" name="name" required value="{{ data.name or '' }}">
  </div>
  <div class="field">
    <label for="channel">Channel</label>
    <select id="channel" name="channel" required>
      <option value="email">Email</option>
      <option value="sms">SMS</option>
    </select>
  </div>
  <div class="field">
    <label for="scenario">Scenario</label>
    <select id="scenario" name="scenario" required>
      <option value="mobile_money">Mobile money (MTN MoMo / Orange Money)</option>
      <option value="banking">Banking</option>
      <option value="university">University portal</option>
    </select>
  </div>
  <div class="field">
    <label for="language">Language</label>
    <select id="language" name="language" required>
      <option value="fr">French</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="field">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty" name="difficulty" required>
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>
  <div class="field">
    <label for="brief">Brief (one line for the AI)</label>
    <textarea id="brief" name="brief" rows="2" required
              placeholder="e.g. MTN MoMo deposit confirmation needed urgently">{{ data.brief or '' }}</textarea>
  </div>
  <button class="btn" type="submit">Generate with AI</button>
  <p class="muted">Generation takes a few seconds and costs about US$0.03.</p>
</form>
</div>
{% endblock %}
